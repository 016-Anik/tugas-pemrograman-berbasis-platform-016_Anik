
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Profil - Utility First</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 min-h-screen bg-[#fff5f8] px-3 py-6 font-sans text-[#493746] sm:px-4 sm:py-8">
    <main class="mx-auto w-full max-w-4xl text-center">
        <h1 class="mb-2 text-2xl font-bold text-[#a34f78] sm:text-[28px]">
            Kartu Profil Mahasiswa
        </h1>

        <p class="mb-7 leading-relaxed text-[#806b79]">
            Contoh pendekatan utility-first
        </p>

        <section class="flex justify-center">
            <article class="w-full max-w-80 rounded-[20px] border border-[#f1d5e2] bg-white p-5 shadow-[0_8px_24px_#9c547a14] sm:p-6">
                <img
                    class="mx-auto h-28 w-28 rounded-full border-4 border-[#f8dce9] object-cover"
                    src="fotonew.jpeg"
                    alt="Foto profil Sri Maulani"
                >

                <h2 class="mb-2 mt-4 text-[22px] font-bold">
                    Sri Maulani
                </h2>

                <p class="mb-5 text-sm text-[#806b79]">
                    NIM: 2024520016
                </p>

                <a
                    class="inline-block cursor-pointer rounded-xl bg-[#c65d91] px-5 py-3 text-sm font-bold text-white no-underline hover:bg-[#a94778]"
                    href="#profil-Sri_Maulani"
                >
                    Lihat Profil
                </a>
            </article>
        </section>
    </main>
</body>
</html>
