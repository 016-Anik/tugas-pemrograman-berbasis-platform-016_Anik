
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Profil - Component Based</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 32px 16px;
            font-family: Arial, sans-serif;
            background: #fff5f8;
            color: #493746;
        }

        .page {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }

        .page-title {
            margin: 0 0 8px;
            color: #a34f78;
            font-size: 28px;
        }

        .page-description {
            margin: 0 0 28px;
            color: #806b79;
            line-height: 1.6;
        }

        .card-list {
            display: flex;
            justify-content: center;
        }

        .card {
            width: 100%;
            max-width: 320px;
            padding: 24px;
            background: #ffffff;
            border: 1px solid #f1d5e2;
            border-radius: 20px;
            box-shadow: 0 8px 24px #9c547a14;
        }

        .card-photo {
            width: 112px;
            height: 112px;
            object-fit: cover;
            border: 4px solid #f8dce9;
            border-radius: 50%;
        }

        .card-name {
            margin: 16px 0 8px;
            font-size: 22px;
        }

        .card-nim {
            margin: 0 0 20px;
            color: #806b79;
            font-size: 14px;
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            border: 0;
            border-radius: 12px;
            background: #c65d91;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .btn:hover {
            background: #a94778;
        }

        @media (max-width: 360px) {
            body {
                padding: 24px 12px;
            }

            .page-title {
                font-size: 24px;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <h1 class="page-title">Kartu Profil Mahasiswa</h1>
        <p class="page-description">
            Contoh pendekatan component-based
        </p>

        <section class="card-list">
            <article class="card">
                <img
                    class="card-photo"
                    src="fotonew.jpeg"
                    alt="Foto profil Sri Maulani"
                >

                <h2 class="card-name">Sri Maulani</h2>
                <p class="card-nim">NIM: 2024520016</p>

                <a class="btn" href="#profil-maulani">
                    Lihat Profil
                </a>
            </article>
        </section>
    </main>
</body>
</html>
